# Baseline CNN model config
# Usage:
#   .venv/bin/python main.py --model baseline_cnn --task train

common:
  # Base directory containing train/val/test splits
  data_root: data/classification/boxing4cls
  # Target width and height to resize all frames
  image_size: 128
  # Number of samples per batch
  batch_size: 16
  # Number of subprocesses to use for data loading
  num_workers: 2
  # Number of frames to extract from each video (1 = middle frame)
  frames_per_video: 10
  # Hardware to use (auto, cpu, cuda, mps)
  device: auto

train:
  # Comma-separated list of classes. 'not_jab' automatically groups negative classes.
  class_names: jab,not_jab
  # Total number of training loops over the entire dataset
  epochs: 30
  # Learning rate for the AdamW optimizer
  lr: 0.001
  # Weight decay (L2 penalty) for the optimizer
  weight_decay: 0.0001
  # Fraction of training data to use for validation if `val` folder is empty
  val_ratio: 0.2
  # Epochs to wait for val_macro_f1 to improve before early stopping
  patience: 5
  # Epochs to wait before reducing the learning rate
  lr_patience: 2
  # Whether to compute and apply class weights to handle imbalanced datasets
  use_class_weights: true
  # Directory where run artifacts (checkpoints, metrics) will be saved
  output_dir: models/advanced_cnn/runs
  # Subfolder prefix for the current run
  run_name: advanced_jab_vs_not_jab

test:
  # Path to the best checkpoint saved during training
  checkpoint: models/advanced_cnn/runs/advanced_jab_vs_not_jab_20260424_171243/checkpoints/best.pt
  # Directory where the test metrics and report will be saved
  report_dir: models/advanced_cnn/eval
  # Name of the subfolder for this test run
  run_name: test_jab_vs_not_jab

validate:
  # Path to the best checkpoint saved during training
  checkpoint: models/baseline_cnn/runs/REPLACE_WITH_RUN/checkpoints/best.pt
  # Directory where the validation metrics and report will be saved
  report_dir: models/baseline_cnn/eval
  # Name of the subfolder for this validation run
  run_name: val_jab_vs_not_jab

inference:
  # Path to the best checkpoint saved during training
  checkpoint: models/advanced_cnn/runs/advanced_jab_vs_not_jab_20260424_171243/checkpoints/best.pt
  # Path to the raw video you want to classify
  input_video: data/classification/boxing4cls/inference/input_sample.mp4
  # Path where the labeled output video should be saved
  output_video: models/advanced_cnn/inference/output_labeled.mp4
  # Architecture to use for the frame extraction/inference
  model_name: resnet18
  # Weights to load for the architecture
  weights: DEFAULT
  # Process 1 frame every N frames (higher = faster but choppy labels)
  frame_stride: 1
  # OpenCV video codec for output (e.g., mp4v)
  codec: mp4v
  # Output frames per second (0 uses the original video's FPS)
  fps: 0
