# Global Configuration for Data Pre-processing
data:
  annotations_file: "data/annotations.csv"
  video_dir: "data/downloaded-videos"
  processed_frames_dir: "data/processed/frames"
  manifest_file: "data/processed/dataset_manifest_kush.csv"
  processed_clips_dir: "data/processed/clips"
  clip_manifest_file: "data/processed/clip_manifest.csv"

# Global Target Classes
classes: ["straight", "hook", "uppercut", "none"]

# Data Preparation Constraints
# ----------------------------
# uniform_samples_per_class:
#   - null   : Uses all available samples (no limits applied).
#   - "auto" : Dynamically finds the minority class count and strictly balances 
#              all other classes to match this number. This prevents class imbalance.
#   - <int>  : Hard limit (e.g. 500). Limits each class to exactly this many samples.
# 
# Note: For uniform sampling, the script distributes the quota evenly across all 
#       unique videos for a given class. It interleaves frames from different videos
#       to ensure maximum diversity and avoids front-loading frames from a single video.
preparation:
  uniform_samples_per_class: "auto"
  # Frames before the annotated peak frame to include in the clip.
  # Keep in sync with cnn_lstm clip_length (pre + post + 1) and re-run prepare_data if changed.
  clip_pre_frames: 8
  # Frames after the annotated peak frame to include in the clip.
  # Keep in sync with cnn_lstm clip_length (pre + post + 1) and re-run prepare_data if changed.
  clip_post_frames: 3

# Data Augmentation Configuration
augmentation:
  # Basic augmentations
  random_horizontal_flip_p: 0.5
  color_jitter:
    brightness: 0.2
    contrast: 0.2
    saturation: 0.15
  
  # Motion-specific augmentations for punch classification
  random_rotation:
    degrees: 15  # Small rotations to simulate motion variations
  random_affine:
    degrees: 0
    translate: [0.1, 0.1]  # Small translations
    scale: [0.9, 1.1]     # Small scaling
    shear: 5               # Small shearing
  random_erasing:
    p: 0.3        # Probability of random erasing
    scale: [0.02, 0.1]  # Size of erased area
    ratio: [0.3, 3.3]   # Aspect ratio of erased area
  
  # Normalization (ImageNet stats for transfer learning)
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]