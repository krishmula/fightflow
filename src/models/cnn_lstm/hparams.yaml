# CNN+LSTM clip classifier configuration
# Usage:
#   python main.py --model cnn_lstm --task train

common:
  # Target width and height to resize all frames
  image_size: 224
  # Number of samples per batch
  batch_size: 8
  # Number of subprocesses to use for data loading
  num_workers: 2
  # Hardware to use (auto, cpu, cuda, mps)
  device: auto
  # Random seed for reproducibility
  seed: 42
  # Data splitting configuration
  splits:
    train: 0.80
    val: 0.10
    test: 0.10
  # Fixed number of frames per clip fed to the LSTM (clips are subsampled/padded to this length).
  # If you change this, consider updating clip_pre_frames/clip_post_frames in base/data_config.yaml and re-running prepare_data.
  clip_length: 12
  # CNN backbone architecture (cnn_baseline, cnn_advanced, resnet18, vgg_16)
  cnn_backbone: resnet18
  # CNN weight init source:
  #   - latest: Picks the newest folder under runs/<cnn_backbone>/ by modified time and looks for checkpoints/best.pt
  #   - imagenet: ImageNet weights (used with resnet18/vgg_16 backbone only)
  #   - random: Random init (no pretrained weights)
  #   - <path>: Explicit checkpoint path (e.g., runs/<cnn_backbone>/<run_name>/checkpoints/best.pt)
  cnn_init: latest
  # Freeze the CNN backbone during LSTM training
  freeze_backbone: true
  # LSTM hidden size
  lstm_hidden: 256
  # LSTM layer count
  lstm_layers: 1
  # LSTM dropout between layers (ignored if lstm_layers = 1)
  lstm_dropout: 0.0
  # Use a bidirectional LSTM
  lstm_bidirectional: true
  # LSTM pooling strategy: last or mean
  lstm_output: mean
  # Optional projection dim before LSTM (0/empty = no projection)
  feature_dim: 512
  # Enable training-time augmentation from base/data_config.yaml
  augment: true

train:
  # Comma-separated list of classes
  class_names: straight,hook,uppercut,none
  # Total number of training loops over the entire dataset
  epochs: 25
  # Learning rate for the AdamW optimizer
  lr: 0.0001
  # Weight decay (L2 penalty) for the optimizer
  weight_decay: 0.0001
  # Epochs to wait for val_macro_f1 to improve before early stopping
  patience: 6
  # Epochs to wait before reducing the learning rate
  lr_patience: 2
  # Whether to compute and apply class weights to handle imbalanced datasets
  use_class_weights: true
  # Directory where run artifacts (checkpoints, metrics) will be saved
  output_dir: runs/cnn_lstm
  # Subfolder prefix for the current run
  run_name: cnn_lstm
  # Directory where the evaluation metrics and report will be saved
  report_dir: runs/cnn_lstm/eval

test:
  # Path to the best checkpoint saved during training
  checkpoint: runs/cnn_lstm/REPLACE_WITH_RUN/checkpoints/best.pt
  # Directory where the test metrics and report will be saved
  report_dir: runs/cnn_lstm/eval
  # Name of the subfolder for this test run
  run_name: test_cnn_lstm

validate:
  # Path to the best checkpoint saved during training
  checkpoint: runs/cnn_lstm/REPLACE_WITH_RUN/checkpoints/best.pt
  # Directory where the validation metrics and report will be saved
  report_dir: runs/cnn_lstm/eval
  # Name of the subfolder for this validation run
  run_name: val_cnn_lstm
